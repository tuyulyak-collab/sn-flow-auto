<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SN Flow Auto</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="snf-header">
    <div class="snf-brand">
      <div class="snf-logo">SN</div>
      <div class="snf-titles">
        <h1>SN Flow Auto</h1>
        <p>Batch prompt automation for Google Flow</p>
      </div>
    </div>
    <div class="snf-pill" id="snf-status">idle</div>
  </header>

  <section class="snf-card">
    <div class="snf-grid3">
      <div class="snf-col">
        <label class="snf-label" for="snf-mode">Mode</label>
        <select id="snf-mode" class="snf-select snf-fullw">
          <option value="image">Image</option>
          <option value="video">Video</option>
        </select>
      </div>
      <div class="snf-col">
        <label class="snf-label" for="snf-aspect">Aspect ratio</label>
        <select id="snf-aspect" class="snf-select snf-fullw">
          <option value="16:9">16:9 — Landscape</option>
          <option value="4:3">4:3</option>
          <option value="1:1">1:1 — Square</option>
          <option value="3:4">3:4</option>
          <option value="9:16">9:16 — Portrait</option>
        </select>
      </div>
      <div class="snf-col">
        <label class="snf-label" for="snf-count">Output</label>
        <select id="snf-count" class="snf-select snf-fullw">
          <option value="1">x1</option>
          <option value="2">x2</option>
          <option value="3">x3</option>
          <option value="4">x4</option>
        </select>
      </div>
    </div>

    <label class="snf-label" for="snf-prompts">Prompts (one per line)</label>
    <textarea id="snf-prompts" class="snf-textarea" rows="6"
      placeholder="A cinematic sunrise over Bali rice terraces&#10;A tiny astronaut planting flowers on the moon&#10;..."></textarea>

    <div class="snf-actions snf-import">
      <label class="snf-btn snf-secondary" for="snf-file">Import .txt</label>
      <input id="snf-file" type="file" accept=".txt,text/plain" hidden />
      <button id="snf-add" class="snf-btn snf-primary">Add to Queue</button>
      <span id="snf-import-info" class="snf-meta"></span>
    </div>
  </section>

  <section class="snf-card snf-pacing-card">
    <div class="snf-card-head">
      <h2>Pacing &amp; anti-bot</h2>
      <span class="snf-meta">Random delay + cooldown to avoid Flow's rate limit</span>
    </div>
    <div class="snf-grid2">
      <div class="snf-col">
        <label class="snf-label" for="snf-min-delay">Min delay (s)</label>
        <input id="snf-min-delay" class="snf-input" type="number" min="0" step="1" value="30" />
      </div>
      <div class="snf-col">
        <label class="snf-label" for="snf-max-delay">Max delay (s)</label>
        <input id="snf-max-delay" class="snf-input" type="number" min="0" step="1" value="60" />
      </div>
    </div>
    <div class="snf-grid2">
      <div class="snf-col">
        <label class="snf-label" for="snf-cooldown-every">Cooldown every N prompts</label>
        <input id="snf-cooldown-every" class="snf-input" type="number" min="0" step="1" value="5" />
      </div>
      <div class="snf-col">
        <label class="snf-label" for="snf-cooldown-ms">Cooldown duration (s)</label>
        <input id="snf-cooldown-ms" class="snf-input" type="number" min="0" step="1" value="180" />
      </div>
    </div>
    <div class="snf-pacing-toggles">
      <label class="snf-check">
        <input id="snf-adaptive" type="checkbox" checked />
        <span>Adaptive backoff on rate-limit (×2 each block, capped 15 min)</span>
      </label>
      <label class="snf-check">
        <input id="snf-pause-rl" type="checkbox" checked />
        <span>Auto-pause queue after 3 consecutive rate-limit signals</span>
      </label>
      <label class="snf-check snf-warn">
        <input id="snf-aggressive" type="checkbox" />
        <span><strong>Aggressive mode</strong> — collapse all delays to 0 (risk: account block)</span>
      </label>
    </div>
    <div class="snf-pacer-state">
      <span id="snf-pacer-meta" class="snf-meta">—</span>
    </div>
  </section>

  <section class="snf-card">
    <div class="snf-progress-wrap">
      <div class="snf-progress"><span id="snf-progress-fill"></span></div>
      <div class="snf-progress-meta">
        <span id="snf-progress-text">0 / 0</span>
        <span id="snf-progress-status">—</span>
      </div>
    </div>

    <div class="snf-controls">
      <button id="snf-start" class="snf-btn snf-primary">Start</button>
      <button id="snf-pause" class="snf-btn snf-secondary">Pause</button>
      <button id="snf-resume" class="snf-btn snf-secondary">Resume</button>
      <button id="snf-stop" class="snf-btn snf-secondary">Stop</button>
      <button id="snf-retry" class="snf-btn snf-secondary">Retry Failed</button>
      <button id="snf-clear" class="snf-btn snf-danger">Clear Queue</button>
    </div>
  </section>

  <section class="snf-card">
    <div class="snf-card-head">
      <h2>Queue</h2>
      <span id="snf-queue-count" class="snf-meta">0 items</span>
    </div>
    <div class="snf-table-wrap">
      <table class="snf-table" id="snf-queue-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Prompt</th>
            <th>Mode</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="snf-queue-body"></tbody>
      </table>
    </div>
  </section>

  <section class="snf-card snf-log-card">
    <div class="snf-card-head">
      <h2>Log</h2>
      <button id="snf-log-clear" class="snf-link">clear</button>
    </div>
    <pre id="snf-log" class="snf-log"></pre>
  </section>

  <footer class="snf-footer">
    <span>v0.1.0</span>
    <span>Files saved to <code>SN_Flow_Auto/</code> in your Downloads folder</span>
  </footer>

  <!--
    Custom in-popup confirm modal. We avoid native window.confirm() in MV3
    popups because the popup loses focus when the OS-level dialog opens, which
    closes the popup and kills any post-await code (so e.g. Stop never sends
    its STOP command). HTMLDialogElement.showModal() is same-document so the
    popup keeps focus and the click handler resumes normally.
  -->
  <dialog id="snf-confirm" class="snf-dialog">
    <div class="snf-dialog-body">
      <h3 id="snf-confirm-title" class="snf-dialog-title">Confirm</h3>
      <p id="snf-confirm-message" class="snf-dialog-message"></p>
    </div>
    <div class="snf-dialog-actions">
      <button type="button" id="snf-confirm-cancel" class="snf-btn snf-secondary">Cancel</button>
      <button type="button" id="snf-confirm-ok" class="snf-btn snf-primary">OK</button>
    </div>
  </dialog>

  <script src="../core/logger.js"></script>
  <script src="../core/retry.js"></script>
  <script src="../core/filename-template.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../core/queue-manager.js"></script>
  <script src="../core/prompt-parser.js"></script>
  <script src="../core/pacing.js"></script>
  <script src="popup.js"></script>
</body>
</html>
